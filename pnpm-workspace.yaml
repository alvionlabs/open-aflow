packages:
  - packages/*

# esbuild (used by Vite and tsx) runs a postinstall check for its native binary.
allowBuilds:
  # Squirrel only. The NSIS target never runs it.
  electron-winstaller: false
  esbuild: true
  # Spike only: the Electron binary and node-pty's prebuilt binary.
  electron: true
  node-pty: false
