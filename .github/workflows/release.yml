# Starts only when the human pushes a tag v<major>.<minor>.<patch>. `build` checks the installer with no write token.
# `publish` runs no code from the repo. See pod-docs/codebase-structure.md (## CI).
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Check the tag against the package version
        run: pnpm release:check "--tag=$env:TAG"
        env:
          TAG: ${{ github.ref_name }}
      - run: pnpm verify
      - run: pnpm package
      - name: Check the installer, install it, and start it
        run: pnpm release:check packages/desktop/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          if-no-files-found: error
          retention-days: 1
          path: |
            packages/desktop/release/openaflow-setup-*.exe
            packages/desktop/release/openaflow-setup-*.exe.blockmap
            packages/desktop/release/latest.yml

  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      # An existing release for the tag makes this command fail, so nothing is overwritten.
      - name: Create the release
        run: |
          $files = @(Get-ChildItem release-files -File | ForEach-Object FullName)
          if ($files.Count -ne 3) { throw "expected 3 files, got $($files.Count)" }
          gh release create "$env:TAG" @files --repo "$env:REPO" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
